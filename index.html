<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할 일</title>
<meta name="theme-color" content="#2f5bea">
<!-- 폰트: Pretendard (한글+영문 무료 폰트, 화면에 쓰인 글자만 나눠 받는 방식이라 가벼움) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon/icon-192.png">
<link rel="apple-touch-icon" href="icon/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일">
<style>
/* 기본: 다크 모드 */
:root{
  color-scheme:dark;
  --bg:#111318; --panel:#1a1d24; --text:#e7e9ee; --muted:#9aa1ad; --line:#2a2f39;
  --accent:#6f8fff; --accent-soft:#232c48; --danger:#ff6b6b; --danger-soft:#3a2224;
  --ok:#4cc38a; --radius:10px; --shadow:none;
}
/* 라이트 모드: <html data-theme="light"> 일 때만 (나중에 전환 버튼용으로 남겨둠) */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f6f8; --panel:#ffffff; --text:#1c1f24; --muted:#6b7280; --line:#e4e7ec;
  --accent:#2f5bea; --accent-soft:#e8eefe; --danger:#d93b3b; --danger-soft:#fdecec;
  --ok:#1f9d55; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- auth / setup ---------- */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:22px}
.card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.link{background:none;border:none;color:var(--accent);padding:0;font-size:14px}
.msg{font-size:13px;margin-top:10px;min-height:1em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding:4px 8px 12px}
.brand img{width:24px;height:24px;border-radius:6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;border-radius:8px;background:none;text-align:left}
.navbtn:hover{background:var(--bg)}
.navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.navbtn.active .count{color:var(--accent)}
.navbtn .count.warn{color:var(--danger);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.side h3{font-size:12px;font-weight:600;color:var(--muted);margin:16px 10px 4px;display:flex;align-items:center}
.side h3 button{margin-left:auto;border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.side h3 button:hover{color:var(--accent)}
.newproj{display:flex;gap:6px;padding:4px 6px}
.newproj .input{padding:6px 8px;font-size:14px}
.side .spacer{flex:1}
.navbtn.proj{cursor:grab}
.navbtn.dragging{opacity:.4}
.navbtn.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.navbtn.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.head .hicon{font-size:22px;line-height:1}
.search{margin:0 0 14px;background:var(--panel)}
.search-info{font-size:13px;color:var(--muted);margin:0 0 12px}
mark{background:#f5a524;color:#111318;border-radius:3px;padding:0 2px}.side .who{font-size:12px;color:var(--muted);padding:8px 10px;word-break:break-all}

.main{padding:24px 32px 80px;max-width:860px;width:100%}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.head h2{margin:0;font-size:22px}
.head .sub{color:var(--muted);font-size:14px}
.head .actions{margin-left:auto;display:flex;gap:6px}
.wkcal{position:relative;display:inline-flex}
.wkpick{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}

/* add bar */
.addbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);margin-bottom:20px}
.addbar .title{flex:1 1 240px;border:none;background:transparent;padding:8px;outline:none;min-width:0}
.addbar input[type=date],.addbar select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;min-width:0}
.quick{display:flex;gap:4px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* list */
.group{margin-bottom:22px}
.group h4{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--text);display:flex;gap:8px;align-items:baseline}
.group h4 .n{font-size:13px;font-weight:400}
.group.overdue h4{color:var(--danger)}
.group.today h4{color:var(--accent)}
.group.upcoming{opacity:.75}
.sgroup+.sgroup{margin-top:10px}
.sgroup h5{margin:0 0 6px 4px;font-size:15px;font-weight:700;color:var(--text);display:flex;gap:8px;align-items:center}
.sgroup h5 .dot{width:10px;height:10px}
.sgroup h5 .n{font-weight:400;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.check{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;display:flex;align-items:center;justify-content:center}
.check:hover{border-color:var(--accent)}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ibody{flex:1;min-width:0;cursor:pointer}
.ititle{word-break:break-word}
.item.done .ititle{color:var(--muted)}   /* 완료: ✅ 체크 + 흐린 글씨 (취소선 없음) */
.imeta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.imeta .late{color:var(--danger)}
.pchip{display:inline-flex;align-items:center;gap:4px}
.pchip .dot{width:8px;height:8px}
.imemo{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:4px;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
.toggle-done{margin-top:6px}

/* dialog */
dialog{border:none;border-radius:14px;padding:0;background:var(--panel);color:var(--text);width:min(460px,calc(100% - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:20px}
.dlg h3{margin:0 0 14px;font-size:17px}
.dlg textarea{min-height:90px;resize:vertical}
.dlg .row{display:flex;gap:8px}
.dlg .row>*{flex:1;min-width:0}
.dlg .foot{display:flex;gap:8px;margin-top:16px}
.dlg .foot .grow{flex:1}
/* 날씨 (넓은 화면 전용) */
.wx{display:none}
@media (min-width:1280px){
  .app{grid-template-columns:240px minmax(0,860px) minmax(280px,340px)}
  .wx{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:24px 24px 56px 8px}
}
.wxcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.wxloc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.wxloc .link{font-size:13px;color:var(--text);text-align:left}
.wxnow{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.wxemo,.wxtemp{font-size:44px;line-height:1}
.wxtemp{font-weight:700}
.wxdesc{font-size:16px;font-weight:700}
.wxsub{font-size:13px;color:var(--muted);margin-top:2px}
.wxstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
.wxstats b{display:block;font-size:15px;color:var(--text)}
.wxair{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.wxair b{display:block;font-size:16px;margin:2px 0}
.g1{color:#4c9aff}.g2{color:var(--ok)}.g3{color:#f5a524}.g4{color:var(--danger)}
.wxh{font-size:13px;font-weight:700;margin-bottom:8px}
.wxhours{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;text-align:center;font-size:13px}
.wxhours small{display:block;color:var(--muted);font-size:11px}
.wxhours span{display:block;font-size:18px;margin:2px 0}
.wxhours .wxpop,.wxday .wxpop{color:#4c9aff}
.wxday{display:grid;grid-template-columns:40px 30px 44px 1fr;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.wxh+.wxday{border-top:none}
.wxday>span:last-child{text-align:right}
.wxday .lo{color:var(--muted)}
.wxsrc{font-size:11px;color:var(--muted);text-align:right;opacity:.7}
.wxerr{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted);font-size:14px}

/* 꿀팁 메모 */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;min-width:0}
.note:hover{border-color:var(--muted)}
.note{display:flex;align-items:center;justify-content:center;text-align:center}
.note h4{margin:0;font-size:15px;font-weight:700;word-break:break-word}
#noteDlg{width:min(960px,calc(100% - 32px))}
#noteDlg textarea{min-height:320px}
.nview-body{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:65vh;overflow:auto;user-select:text}
/* 반복 설정 */
.rbtn{width:100%;justify-content:flex-start}
.rbtn.on{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;padding:8px;border:none;background:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rline{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;cursor:pointer}
.rline input[type=radio],.rline input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.rnum{width:80px;padding:6px 8px}
.rdate{width:auto;padding:6px 8px}
.field .rline span{display:inline;margin:0;font-size:14px;color:inherit}
.field .rline #rUntilLbl{color:var(--muted);font-size:13px}
.rsum{font-size:14px;color:var(--accent);font-weight:700;margin-top:4px}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.imeta .daily{color:var(--accent)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.colors button.on{border-color:var(--text)}

.ver{position:fixed;right:12px;bottom:8px;font-size:22px;color:var(--muted);opacity:.7;pointer-events:none;z-index:5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;border-right:none;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand,.side h3,.side .spacer,.side .who,.newproj{display:none}
  .navbtn{width:auto;flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
  .navbtn .count{margin-left:4px}
  .navbtn.mobile-only{display:flex}
  .main{padding:16px 16px 80px}
  .head h2{font-size:19px}
  .addbar .title{flex-basis:100%}
  .ver{display:none}
}
.mobile-only{display:none}
</style>
</head>
<body>
<!-- 앱 버전: 올릴 때 README.md '버전 기록'도 함께 갱신 -->
<div class="ver">v1.2</div>

<!-- 설정 안내 -->
<div id="setup" class="center hidden">
  <div class="card">
    <h1>설정이 필요해요</h1>
    <p><code>config.js</code> 파일에 Supabase URL과 Publishable key를 넣은 뒤 다시 열어주세요.</p>
  </div>
</div>

<!-- 로그인 -->
<div id="auth" class="center hidden">
  <form class="card" id="authForm">
    <h1 id="authTitle">로그인</h1>
    <p>회사 업무 할 일 정리</p>
    <label class="field"><span>이메일</span><input class="input" type="email" id="email" required autocomplete="email"></label>
    <label class="field"><span>비밀번호</span><input class="input" type="password" id="password" required minlength="6" autocomplete="current-password"></label>
    <button class="btn primary block" type="submit" id="authBtn">로그인</button>
    <div class="msg" id="authMsg"></div>
    <div style="margin-top:14px;text-align:center"><button type="button" class="link" id="authSwitch">처음이신가요? 계정 만들기</button></div>
  </form>
</div>

<!-- 앱 -->
<div id="app" class="app hidden">
  <nav class="side" id="side"></nav>
  <main class="main">
    <div class="head" id="head"></div>
    <!-- 찾기: 주간·프로젝트 화면에서만 보임. 화면을 다시 그려도 입력칸은 그대로라 글자 입력이 끊기지 않음 -->
    <input class="input search hidden" id="search" type="search" placeholder="🔍 찾기 (제목·메모, 전체 기간)" autocomplete="off">
    <form class="addbar" id="addForm" autocomplete="off">
      <input class="title" id="addTitle" placeholder="할 일 추가… (Enter)" required>
      <div class="quick" id="quick"></div>
      <input type="date" id="addDate" aria-label="날짜">
      <select id="addProject" aria-label="프로젝트"></select>
      <button class="btn primary" type="submit">추가</button>
    </form>
    <div id="content"></div>
  </main>
  <!-- 날씨: 화면 폭 1280px 이상에서만 보임 -->
  <aside class="wx" id="wx"></aside>
</div>

<!-- 할 일 편집 -->
<dialog id="todoDlg">
  <form class="dlg" method="dialog" id="todoForm">
    <h3>할 일 수정</h3>
    <label class="field"><span>제목</span><input class="input" id="tTitle" required></label>
    <div class="row">
      <label class="field"><span id="tDateLabel">날짜</span><input class="input" type="date" id="tDate"></label>
      <label class="field"><span>프로젝트</span><select class="input" id="tProject"></select></label>
    </div>
    <div class="field"><span>반복</span><button type="button" class="btn rbtn" id="tRepeat">반복 안 함</button></div>
    <label class="field"><span>메모</span><textarea class="input" id="tMemo"></textarea></label>
    <div class="foot">
      <button class="btn danger" type="button" id="tDelete">삭제</button>
      <span class="grow"></span>
      <button class="btn ok" type="button" id="tClose">완료</button>
      <button class="btn" type="button" id="tCancel">취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<!-- 반복 설정 -->
<dialog id="repDlg">
  <form class="dlg" method="dialog" id="repForm">
    <h3>🔁 반복 설정</h3>
    <div class="field">
      <span>반복 주기</span>
      <div class="seg" id="rUnit">
        <button type="button" data-u="day">X일마다</button><button type="button" data-u="week">X주마다</button><button type="button" data-u="month">X개월마다</button>
      </div>
      <div class="rline"><input class="input rnum" type="number" id="rEvery" min="1" max="365" value="1"><span id="rEveryLbl">일마다</span></div>
    </div>
    <div class="field">
      <span>종료</span>
      <label class="rline"><input type="radio" name="rEnd" value="never" checked> 계속 반복</label>
      <label class="rline"><input type="radio" name="rEnd" value="count"> <input class="input rnum" type="number" id="rCount" min="1" max="999" value="10"> 회 반복</label>
      <label class="rline"><input type="radio" name="rEnd" value="until"> <input class="input rdate" type="date" id="rUntil"> <span id="rUntilLbl"></span></label>
    </div>
    <div class="field">
      <span>놓쳤을 때</span>
      <label class="rline"><input type="checkbox" id="rCarry" checked> 체크 못 하고 지나가면 '밀린 일'에 표시</label>
    </div>
    <div class="rsum" id="rSum"></div>
    <div class="foot">
      <button class="btn danger" type="button" id="rOff">반복 안 함</button>
      <span class="grow"></span>
      <button class="btn" type="button" id="rCancel">취소</button>
      <button class="btn primary" type="submit">확인</button>
    </div>
  </form>
</dialog>

<!-- 꿀팁 메모 편집 -->
<dialog id="noteDlg">
  <form class="dlg" method="dialog" id="noteForm">
    <!-- 보기 모드: 저장된 메모를 누르면 먼저 이 화면 (글자 선택·복사 가능) -->
    <div id="nView">
      <h3 id="nViewTitle"></h3>
      <div class="nview-body" id="nViewBody"></div>
    </div>
    <!-- 수정 모드: [수정] 버튼 또는 새 메모 -->
    <div id="nEdit">
      <h3 id="nDlgTitle">메모</h3>
      <label class="field"><span>제목</span><input class="input" id="nTitle" placeholder="예: 회사 VPN 접속 방법"></label>
      <label class="field"><span>내용</span><textarea class="input" id="nBody"></textarea></label>
    </div>
    <div class="foot">
      <button class="btn danger" type="button" id="nDelete">삭제</button>
      <span class="grow"></span>
      <button class="btn" type="button" id="nCancel">취소</button>
      <button class="btn primary" type="button" id="nEditBtn">수정</button>
      <button class="btn primary" type="submit" id="nSave">저장</button>
    </div>
  </form>
</dialog>

<!-- 프로젝트 편집 -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function setKids(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); }
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// 하루의 시작 = 아침 8시. 0시~8시 전은 아직 '전날'로 취급 (반복하는 일이 나타나는 시각과 같음)
const DAY_START_HOUR = 8;
const workDay = (d) => ymd(new Date(d.getTime() - DAY_START_HOUR * 3600e3));   // 어떤 시각이 속한 '하루' 날짜
const today = () => workDay(new Date());
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); }
// 주간 기준: 금요일 시작 ~ 목요일 끝 (회사 주간보고 기준). s가 속한 주의 금요일을 돌려줌
function weekStart(s) { const [y, m, d] = s.split("-").map(Number); return addDays(s, -((new Date(y, m - 1, d).getDay() + 2) % 7)); }
function mdw(s) { const [y, m, d] = s.split("-").map(Number); return `${m}/${d}(${"일월화수목금토"[new Date(y, m - 1, d).getDay()]})`; }
function fmtDate(s) {
  if (!s) return "날짜 없음";
  const [y, m, d] = s.split("-").map(Number);
  const wd = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
  const base = (y !== new Date().getFullYear() ? `${y}년 ` : "") + `${m}월 ${d}일 (${wd})`;
  const t = today();
  if (s === t) return `오늘 · ${base}`;
  if (s === addDays(t, 1)) return `내일 · ${base}`;
  if (s === addDays(t, -1)) return `어제 · ${base}`;
  return base;
}
function shortDate(s) {
  if (!s) return "";
  const t = today();
  if (s === t) return "오늘";
  if (s === addDays(t, 1)) return "내일";
  if (s === addDays(t, -1)) return "어제";
  const [y, m, d] = s.split("-").map(Number);
  return (y !== new Date().getFullYear() ? `${y}.` : "") + `${m}/${d}`;
}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = h("div", { class: "toast" }); document.body.append(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
const COLORS = ["#2f5bea", "#e5484d", "#f5a524", "#1f9d55", "#8e4ec6", "#0ea5b7", "#d6409f", "#6b7280"];

/* ================= Supabase ================= */
const cfg = window.TODO_CONFIG || {};
const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes("YOUR-PROJECT") && cfg.SUPABASE_KEY && !cfg.SUPABASE_KEY.includes("YOUR-");
if (!configured || !window.supabase) {
  $("setup").classList.remove("hidden");
  throw new Error("config not set");
}
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

/* ================= 상태 ================= */
const S = {
  user: null,
  projects: [],
  todos: [],
  checks: new Set(),      // 반복하는 일의 날짜별 체크: "할일id|YYYY-MM-DD"
  notes: [],              // 꿀팁 메모 (최근 수정순)
  notesErr: "",           // 메모 불러오기 실패 메시지 (실패해도 할 일 기능은 그대로 동작)
  view: "today",          // today(오늘) | week(주간) | repeat(반복) | tips(꿀팁) | p:<id>  (접속하면 항상 오늘)
  weekOffset: 0,          // 0 = 이번 주, -1 = 지난주, 1 = 다음 주 …
  showDoneInProject: false,
  search: "",             // 찾기 입력 (주간·프로젝트 화면)
  quickDate: "today",     // today | tomorrow | none | custom
  addRepeat: null,        // 추가줄의 반복 설정 {unit, every, count, until} 또는 null
};
const projById = (id) => S.projects.find((p) => p.id === id);
function curWeek() { const s = addDays(weekStart(today()), S.weekOffset * 7); return { s, e: addDays(s, 6) }; }

/* ================= 인증 ================= */
let signupMode = false;
$("authSwitch").onclick = () => {
  signupMode = !signupMode;
  $("authTitle").textContent = signupMode ? "계정 만들기" : "로그인";
  $("authBtn").textContent = signupMode ? "가입하기" : "로그인";
  $("authSwitch").textContent = signupMode ? "이미 계정이 있어요. 로그인" : "처음이신가요? 계정 만들기";
  $("password").autocomplete = signupMode ? "new-password" : "current-password";
  setAuthMsg("");
};
function setAuthMsg(t, kind) { const m = $("authMsg"); m.textContent = t; m.className = "msg " + (kind || ""); }
$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("email").value.trim(), password = $("password").value;
  $("authBtn").disabled = true;
  setAuthMsg(signupMode ? "가입 중…" : "로그인 중…");
  try {
    if (signupMode) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) setAuthMsg("확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.", "ok");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    const m = String(err.message || err);
    setAuthMsg(
      /Invalid login/i.test(m) ? "이메일 또는 비밀번호가 맞지 않아요." :
      /not confirmed/i.test(m) ? "이메일 확인이 아직 안 됐어요. 받은 메일의 링크를 눌러주세요." :
      /Signups not allowed|signup.*disabled/i.test(m) ? "새 가입이 막혀 있어요." : m, "err");
  } finally { $("authBtn").disabled = false; }
};

sb.auth.onAuthStateChange((event, session) => {
  // 콜백 안에서 바로 await 하면 교착될 수 있어 다음 틱으로 넘김
  setTimeout(() => onSession(session), 0);
});
async function onSession(session) {
  const u = session ? session.user : null;
  if (u && S.user && u.id === S.user.id) return;
  S.user = u;
  if (!u) {
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
    return;
  }
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  wxStart();
  await loadAll();
}

/* ================= 데이터 ================= */
// Supabase는 한 번에 최대 1000줄까지만 돌려줌 → 1000줄씩 나눠서 끝까지 받기
async function fetchAll(make) {
  let all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await make().range(from, from + 999);
    if (error) return { error };
    all = all.concat(data);
    if (data.length < 1000) return { data: all };
  }
}
async function loadAll() {
  const [p, open, done, ck, nt] = await Promise.all([
    sb.from("projects").select("*").order("sort_order").order("created_at"),   // 사용자가 정한 순서
    fetchAll(() => sb.from("todos").select("*").eq("done", false).order("id")),
    // 완료한 일 전부 (예전엔 최근 500개만 → 가져온 지난 기록이 잘려서 주간·찾기에서 안 보였음)
    fetchAll(() => sb.from("todos").select("*").eq("done", true).order("done_at", { ascending: false }).order("id")),
    fetchAll(() => sb.from("todo_checks").select("todo_id,day").gte("day", addDays(today(), -400)).order("day").order("todo_id")),   // 최근 400일 체크 기록
    sb.from("notes").select("*").order("updated_at", { ascending: false }),
  ]);
  S.notes = nt.error ? [] : nt.data; S.notesErr = nt.error ? nt.error.message : "";
  const err = p.error || open.error || done.error || ck.error;
  if (err) { toast("불러오기 실패: " + err.message); return; }
  S.projects = p.data;
  S.todos = [...open.data, ...done.data];
  S.checks = new Set(ck.data.map((c) => ckKey(c.todo_id, c.day)));
  if (S.view.startsWith("p:") && !projById(S.view.slice(2))) S.view = "today";
  render();
}
// 다른 기기에서 바꾼 내용 반영: 탭으로 돌아올 때 새로고침
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user) loadAll(); });

async function addTodo(row) {
  const { data, error } = await sb.from("todos").insert(row).select().single();
  if (error) return toast("추가 실패: " + error.message);
  S.todos.push(data); render();
}
async function patchTodo(id, patch) {
  const t = S.todos.find((x) => x.id === id); if (!t) return;
  const backup = { ...t };
  Object.assign(t, patch); render();
  const { error } = await sb.from("todos").update(patch).eq("id", id);
  if (error) { Object.assign(t, backup); render(); toast("저장 실패: " + error.message); }
}
async function deleteTodo(id) {
  const i = S.todos.findIndex((x) => x.id === id); if (i < 0) return;
  const [removed] = S.todos.splice(i, 1); render();
  const { error } = await sb.from("todos").delete().eq("id", id);
  if (error) { S.todos.splice(i, 0, removed); render(); toast("삭제 실패: " + error.message); }
}
function toggleDone(t, fromOverdue) {
  const done = !t.done;
  setKeep(t.id, done && !!fromOverdue);   // 밀린 일 칸에서 체크했을 때만 오늘 하루 남김
  // 완료 시각: 밀린 일 칸에서 체크 = 지금 (늦게 끝낸 일)
  //           주간 등에서 지난 날짜 할 일을 체크 = 그 날짜 정오 (지난 기록 수정 → 그날 한 걸로)
  const backdate = done && !fromOverdue && t.due_date && t.due_date < today();
  const at = backdate ? new Date(toDate(t.due_date).setHours(12)) : new Date();
  patchTodo(t.id, { done, done_at: done ? at.toISOString() : null });
}

/* ---- 반복하는 일 ----
   - repeat_unit: day(X일마다) | week(X주마다) | month(X개월마다), repeat_every = X
   - due_date = 시작일. 반복 날짜마다 그날 아침 8시에 그날 목록에 나타남
   - 끝: repeat_count(횟수) 또는 repeat_until(종료 날짜), 둘 다 없으면 계속 반복
   - 날마다 체크는 todo_checks 표에 (할일, 날짜)로 따로 저장 → 그날만 취소선
   - 다이얼로그의 '완료' 버튼 = 종결 (done = true). 종결한 날까지만 표시
   - 예전 '매일 하는 일'(daily = true)은 '1일마다'로 취급 */
const ckKey = (id, d) => id + "|" + d;
const DAILY_HOUR = DAY_START_HOUR;   // 반복하는 일은 그날 아침 8시에 그날 목록에 나타남
// 반복하는 일이 '도착한' 마지막 날짜 = 오늘 (오늘 자체가 아침 8시에 바뀌므로 같음)
function dailyDay() { return today(); }
const rUnit = (t) => t.repeat_unit || (t.daily ? "day" : null);   // 반복 아니면 null
const rStart = (t) => t.due_date || workDay(new Date(t.created_at));
const repOf = (t) => ({ unit: rUnit(t), every: t.repeat_every || 1, count: t.repeat_count || null, until: t.repeat_until || null, carry: t.repeat_carry !== false });
function toDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
// k번째(0부터) 반복 날짜. 월 반복은 같은 날짜, 그 달에 없으면 말일 (예: 31일 → 30일)
function occAt(t, k) {
  const s = rStart(t), n = (t.repeat_every || 1) * k, u = rUnit(t);
  if (u === "month") { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate()))); }
  return addDays(s, u === "week" ? 7 * n : n);
}
// 마지막 반복 날짜 (종료 날짜 / 횟수 / 종결 중 가장 이른 것). 끝이 없으면 null
function repEnd(t) {
  const ends = [t.repeat_until, t.repeat_count ? occAt(t, t.repeat_count - 1) : null, t.done ? doneOn(t) : null].filter(Boolean);
  return ends.length ? ends.sort()[0] : null;
}
// d가 반복 날짜인지
function isOcc(t, d) {
  const u = rUnit(t), s = rStart(t), e = t.repeat_every || 1;
  if (!u || d < s) return false;
  const end = repEnd(t); if (end && d > end) return false;
  if (u === "month") { const [y1, m1] = s.split("-").map(Number), [y2, m2] = d.split("-").map(Number), diff = (y2 - y1) * 12 + (m2 - m1); return diff % e === 0 && occAt(t, diff / e) === d; }
  return Math.round((toDate(d) - toDate(s)) / 864e5) % (u === "week" ? 7 * e : e) === 0;
}
// d날 목록에 보일지: 반복 날짜이고, 그날 아침 8시가 지났을 때
const activeOn = (t, d) => d <= dailyDay() && isOcc(t, d);
// 놓친 반복: '놓치면 밀린 일에 표시'가 켜져 있고, 가장 최근 반복 날짜(오늘 이전)에 체크를 안 했으면 그 날짜
// (오늘도 반복 날이면 오늘 칸에 이미 나오므로 null → 매일 반복은 밀린 일에 쌓이지 않음)
/* ---- 밀린 일에서 체크한 것 기억 ----
   밀린 일 칸에서 체크하면 오늘 하루 취소선으로 남김.
   주간 등 다른 곳에서 체크하면(지난 기록 수정) 밀린 일에서 바로 사라짐.
   키: 일반 할 일 = 할일id, 반복 = "할일id|날짜". 이 브라우저에 오늘 날짜와 함께 저장 (다음 날 자동 초기화) */
let keepDay = today(), keep = new Set();
try { const o = JSON.parse(localStorage.getItem("todo.keep")); if (o && o.d === keepDay) keep = new Set(o.k); } catch (e) {}
const kept = (k) => keepDay === today() && keep.has(k);
function setKeep(k, on) {
  if (keepDay !== today()) { keepDay = today(); keep = new Set(); }
  on ? keep.add(k) : keep.delete(k);
  try { localStorage.setItem("todo.keep", JSON.stringify({ d: keepDay, k: [...keep] })); } catch (e) {}
}
// keepToday = true면 '밀린 일에서 오늘 체크한' 놓친 반복도 돌려줌 → 오늘 하루는 취소선으로 남김
function missedOcc(t, keepToday) {
  if (!rUnit(t) || t.done || t.repeat_carry === false) return null;
  const ref = dailyDay();
  for (let i = 0, d = ref; i < 400 && d >= rStart(t); i++, d = addDays(d, -1)) {
    if (!isOcc(t, d)) continue;
    if (d === ref) return null;
    const k = ckKey(t.id, d);
    return !S.checks.has(k) || (keepToday && kept(k)) ? d : null;
  }
  return null;
}
// 반복 설명 문구: "2주마다 · 10회", "매일 · 11월 20일 (금)까지"
function repeatText(r) {
  const e = r.every || 1, base = e === 1 ? { day: "매일", week: "매주", month: "매월" }[r.unit] : e + { day: "일마다", week: "주마다", month: "개월마다" }[r.unit];
  return base + (r.count ? ` · ${r.count}회` : r.until ? ` · ${fmtMD(r.until)}까지` : "");
}
function fmtMD(s) { const [, m, d] = s.split("-").map(Number); return `${m}월 ${d}일 (${"일월화수목금토"[toDate(s).getDay()]})`; }
function isChecked(t, d) { return rUnit(t) ? S.checks.has(ckKey(t.id, d)) || (t.done && d >= doneOn(t)) : t.done; }
async function toggleCheck(t, d, fromOverdue) {
  if (t.done) return toast("종결된 일이에요. 눌러서 '다시 진행'을 선택하면 다시 체크할 수 있어요.");
  if (!isOcc(t, d)) return toast(`${shortDate(rStart(t))}부터 시작하는 일이에요.`);
  const k = ckKey(t.id, d), on = !S.checks.has(k);
  on ? S.checks.add(k) : S.checks.delete(k);
  setKeep(k, on && !!fromOverdue);
  render();
  const { error } = on ? await sb.from("todo_checks").insert({ todo_id: t.id, day: d })
    : await sb.from("todo_checks").delete().eq("todo_id", t.id).eq("day", d);
  if (error) { on ? S.checks.delete(k) : S.checks.add(k); render(); toast("저장 실패: " + error.message); }
}

/* ================= 화면: 사이드바 ================= */
function setView(v) { S.view = v; S.weekOffset = 0; S.showDoneInProject = false; render(); }
function moveWeek(n) { S.weekOffset = n === 0 ? 0 : S.weekOffset + n; render(); }
// 달력에서 고른 날짜가 속한 주(금~목)로 이동
function jumpWeek(d) {
  const toDate = (x) => { const [y, m, dd] = x.split("-").map(Number); return new Date(y, m - 1, dd); };
  S.weekOffset = Math.round((toDate(weekStart(d)) - toDate(weekStart(today()))) / (7 * 864e5));
  render();
}
// 📅 버튼 + 숨겨진 날짜 입력칸: 버튼을 누르면 브라우저 기본 달력이 열림
function weekPicker(cur) {
  const pick = h("input", { type: "date", class: "wkpick", tabindex: "-1", "aria-hidden": "true", value: cur,
    onchange: (e) => { if (e.target.value) jumpWeek(e.target.value); } });
  const open = () => { try { pick.showPicker(); } catch (err) { pick.focus(); pick.click(); } };
  return h("span", { class: "wkcal" }, h("button", { class: "btn ghost", title: "달력에서 주 선택", "aria-label": "달력에서 주 선택", onclick: open }, "📅"), pick);
}
function counts() {
  const t = today(); const all = S.todos.filter((x) => !x.done && (!rUnit(x) || liveRepeat(x))), open = all.filter((x) => !rUnit(x));
  const we = addDays(weekStart(t), 6);
  const dailyLeft = all.filter((x) => activeOn(x, t) && !isChecked(x, t)).length;   // 오늘 반복 날인데 아직 체크 안 한 일

    if (!reps.length) out = [emptyEl("반복하는 일이 없어요. 할 일 추가줄의 '🔁 반복'으로 만들 수 있어요")];
  } else if (v === "tips") {
    // 꿀팁: 메모 카드 목록 (최근 수정한 것이 위). 누르면 수정창
    if (S.notesErr) out = [emptyEl("메모를 불러오지 못했어요: " + S.notesErr)];
    else if (!S.notes.length) out = [emptyEl("아직 메모가 없어요. 오른쪽 위 '+ 새 메모'로 추가하세요")];
    else out = [h("div", { class: "notes" }, S.notes.map((n) => h("article", { class: "note", onclick: () => openNote(n) },
      h("h4", {}, n.title || "제목 없음"))))];   // 카드에는 제목만
  } else if (v.startsWith("p:")) {
    const pid = v.slice(2);
    const mine = S.todos.filter((x) => x.project_id === pid);
    const pDaily = mine.filter(liveRepeat), pShown = mine.filter(visible);
    // 지난 완료: 어제 이전에 완료한 일 + 끝난 반복 (아직 시작 전인 반복은 제외)
    const pDone = mine.filter((x) => !pDaily.includes(x) && !pShown.includes(x) && (x.done || (rUnit(x) && repEnd(x) && repEnd(x) < today())));
    out = [groupEl("🔁 반복하는 일", pDaily, { hideProject: true }), ...byDate(pShown, { hideProject: true, desc: true })];
    if (!pShown.length && !pDaily.length) out = [emptyEl("이 프로젝트에 남은 할 일이 없어요")];
    out.push(groupEl("⏳ 시작 예정 반복", mine.filter(upcomingRepeat), { hideProject: true, cls: "upcoming" }));
    if (pDone.length) {
      out.push(h("button", { class: "btn ghost toggle-done", onclick: () => { S.showDoneInProject = !S.showDoneInProject; render(); } },
        (S.showDoneInProject ? "▾ 지난 완료 숨기기" : "▸ 지난 완료 보기") + ` (${pDone.length})`));
      // 최근 날짜가 위 (같은 날짜 안에서는 추가한 순서)
      if (S.showDoneInProject) out.push(groupEl("완료", pDone, { hideProject: true, order: (a, b) => (b.due_date || "").localeCompare(a.due_date || "") || sortTodos(a, b) }));
    }
  }
  box.replaceChildren(...out.filter(Boolean));
}
function render() { if (!S.user) return; renderSide(); renderHead(); renderContent(); }

/* ================= 다이얼로그: 반복 설정 =================
   openRepeat(현재설정 또는 null, 시작일, 확인했을 때 실행할 함수(설정 또는 null)) */
let repCb = null, repUnitSel = "day";
// 반복 설정 → DB 칸 (반복 안 함이면 전부 비움)
const repRow = (r) => ({ daily: false, repeat_unit: r ? r.unit : null, repeat_every: r ? r.every : 1, repeat_count: r ? r.count : null, repeat_until: r ? r.until : null, repeat_carry: r ? r.carry : true });
function openRepeat(cur, start, cb) {
  repCb = cb;
  const r = cur || { unit: "day", every: 1, count: null, until: null, carry: true };
  repUnitSel = r.unit;
  $("rCarry").checked = r.carry !== false;
  $("rEvery").value = r.every || 1;
  $("rCount").value = r.count || 10;
  $("rUntil").min = start;
  $("rUntil").value = r.until || addDays(start, 30);
  document.querySelector(`input[name=rEnd][value=${r.count ? "count" : r.until ? "until" : "never"}]`).checked = true;
  $("rOff").classList.toggle("hidden", !cur);
  syncRep();
  $("repDlg").showModal();
}
function readRep() {
  const end = document.querySelector("input[name=rEnd]:checked").value;
  const num = (id, max) => Math.min(max, Math.max(1, parseInt($(id).value, 10) || 1));
  return { unit: repUnitSel, every: num("rEvery", 365), count: end === "count" ? num("rCount", 999) : null, until: end === "until" ? $("rUntil").value || null : null, carry: $("rCarry").checked };
}
function syncRep() {
  document.querySelectorAll("#rUnit button").forEach((b) => b.classList.toggle("on", b.dataset.u === repUnitSel));
  $("rEveryLbl").textContent = { day: "일마다", week: "주마다", month: "개월마다" }[repUnitSel];
  $("rUntilLbl").textContent = $("rUntil").value ? fmtMD($("rUntil").value) + "까지" : "";
  $("rSum").textContent = "→ " + repeatText(readRep());
}
const pickEnd = (v) => { document.querySelector(`input[name=rEnd][value=${v}]`).checked = true; syncRep(); };
document.querySelectorAll("#rUnit button").forEach((b) => { b.onclick = () => { repUnitSel = b.dataset.u; syncRep(); }; });
document.querySelectorAll("input[name=rEnd]").forEach((x) => { x.onchange = syncRep; });
$("rEvery").oninput = syncRep;
$("rCount").oninput = () => pickEnd("count");
$("rCount").onfocus = () => pickEnd("count");
$("rUntil").oninput = () => pickEnd("until");
// 종료 날짜칸을 누르면 바로 달력 열기
$("rUntil").onclick = () => { pickEnd("until"); try { $("rUntil").showPicker(); } catch (e) {} };
$("rCancel").onclick = () => $("repDlg").close();
$("rOff").onclick = () => { $("repDlg").close(); repCb(null); };
$("repForm").onsubmit = (e) => {
  e.preventDefault();
  const r = readRep();
  if (r.until && r.until < $("rUntil").min) return toast("종료 날짜는 시작일 이후여야 해요.");
  $("repDlg").close(); repCb(r);
};
// 완료 = 종결 (오늘까지만 표시, 내일부터 안 나옴) / 종결된 일이면 '다시 진행'
$("tClose").onclick = () => {
  const t = editing;
  if (t.done) patchTodo(t.id, { done: false, done_at: null });
  else {
    if (!confirm(`'${t.title}'을(를) 종결할까요?\n오늘까지만 표시되고 내일부터는 나오지 않아요.`)) return;
    patchTodo(t.id, { done: true, done_at: new Date().toISOString() });
  }
  $("todoDlg").close();
};
$("tDelete").onclick = () => {
  if (!confirm("이 할 일을 삭제할까요?")) return;
  deleteTodo(editing.id); $("todoDlg").close();
};

/* ================= 날씨 (넓은 화면에서만) =================
   - 날씨/미세먼지: Open-Meteo (무료, 키 필요 없음)
   - 위치: 브라우저 위치 권한 → 거절하면 서울. 위치 이름은 BigDataCloud(무료)로 변환
   - 30분마다 새로 불러옴. 화면이 좁으면(모바일 등) 아예 불러오지 않음 */
const WX_WIDE = window.matchMedia("(min-width:1280px)");
const WX_DEFAULT = { lat: 37.5665, lon: 126.978, name: "서울 (기본 위치)" };
const WX_CODES = {
  0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"], 45: ["안개", "🌫️"], 48: ["안개", "🌫️"],
  51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"], 56: ["어는 이슬비", "🌧️"], 57: ["어는 이슬비", "🌧️"],
  61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"], 66: ["어는 비", "🌧️"], 67: ["어는 비", "🌧️"],
  71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "🌨️"],
  80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌦️"], 82: ["강한 소나기", "⛈️"], 85: ["눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
  95: ["뇌우", "⛈️"], 96: ["우박 동반 뇌우", "⛈️"], 99: ["우박 동반 뇌우", "⛈️"],
};
const wxCode = (c, day = 1) => { const [t, e] = WX_CODES[c] || ["알 수 없음", "🌡️"]; return [t, !day && c <= 1 ? "🌙" : e]; };
// 미세먼지 등급 (환경부 기준): cut = [좋음 상한, 보통 상한, 나쁨 상한]
function pmGrade(v, cut) { let i = cut.findIndex((x) => v <= x); if (i < 0) i = 3; return [["좋음", "보통", "나쁨", "매우 나쁨"][i], "g" + (i + 1)]; }
let wxPos = null, wxStarted = false;
function wxStart() {
  if (wxStarted || !WX_WIDE.matches) return;
  wxStarted = true;
  try { const p = JSON.parse(localStorage.getItem("todo.wxpos")); if (p && p.lat) wxPos = p; } catch (e) {}
  wxLoad();
  wxLocate(false);
  setInterval(wxLoad, 30 * 60000);
}
WX_WIDE.addEventListener("change", () => { if (S.user) wxStart(); });   // 창을 넓히면 그때 시작
function wxLocate(manual) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = +pos.coords.latitude.toFixed(3), lon = +pos.coords.longitude.toFixed(3);
    let name = "현재 위치";
    try {
      const r = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`)).json();
      name = [...new Set([r.city || r.principalSubdivision, r.locality].filter(Boolean))].join(" ") || name;
    } catch (e) {}
    const changed = !wxPos || wxPos.lat !== lat || wxPos.lon !== lon || wxPos.name !== name;
    wxPos = { lat, lon, name };
    try { localStorage.setItem("todo.wxpos", JSON.stringify(wxPos)); } catch (e) {}
    if (changed || manual) wxLoad();
  }, () => { if (manual) toast("위치 권한이 없어서 기본 위치(서울)를 써요."); }, { timeout: 10000, maximumAge: 30 * 60000 });
}
async function wxLoad() {
  const p = wxPos || WX_DEFAULT;
  try {
    const base = `latitude=${p.lat}&longitude=${p.lon}&timezone=auto`;
    const [f, a] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day`
        + `&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
        + `&forecast_days=6&wind_speed_unit=ms`).then((r) => r.json()),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${base}&current=pm10,pm2_5`).then((r) => r.json()).catch(() => null),
    ]);
    if (!f.current) throw new Error(f.reason || "응답 오류");
    renderWx(p, f, a);
  } catch (e) {
    setKids($("wx"), h("div", { class: "wxcard wxerr" }, "날씨를 불러오지 못했어요", h("button", { class: "btn ghost", onclick: wxLoad }, "다시 시도")));
  }
}
function renderWx(p, f, a) {
  const c = f.current, d = f.daily, hr = f.hourly, [desc, emo] = wxCode(c.weather_code, c.is_day);
  const r = (x) => Math.round(x) + "°", pop = (x) => (x ?? 0) + "%";
  // 시간별: 지금 이후 24시간을 3시간 간격으로 8칸
  let i0 = hr.time.findIndex((t) => t.slice(0, 13) >= c.time.slice(0, 13)); if (i0 < 0) i0 = 0;
  const hours = []; for (let i = i0 + 1; i < i0 + 25 && i < hr.time.length; i += 3) hours.push(i);
  const wd = (s) => { const [y, m, dd] = s.split("-").map(Number); return "일월화수목금토"[new Date(y, m - 1, dd).getDay()]; };
  const now = new Date();
  const air = a && a.current ? [["미세먼지", a.current.pm10, [30, 80, 150]], ["초미세먼지", a.current.pm2_5, [15, 35, 75]]] : [];
  setKids($("wx"),
    h("div", { class: "wxcard" },
      h("div", { class: "wxloc" },
        h("button", { class: "link", title: "현재 위치로 다시 찾기", onclick: () => wxLocate(true) }, "📍 " + p.name),
        h("span", {}, `${pad(now.getHours())}:${pad(now.getMinutes())} 기준`)),
      h("div", { class: "wxnow" }, h("span", { class: "wxemo" }, emo), h("span", { class: "wxtemp" }, r(c.temperature_2m))),
      h("div", { class: "wxdesc" }, desc),
      h("div", { class: "wxsub" }, `체감 ${r(c.apparent_temperature)} · 최고 ${r(d.temperature_2m_max[0])} / 최저 ${r(d.temperature_2m_min[0])}`),
      h("div", { class: "wxstats" },
        h("div", {}, h("b", {}, c.relative_humidity_2m + "%"), "습도"),
        h("div", {}, h("b", {}, c.wind_speed_10m.toFixed(1) + "m/s"), "바람"),
        h("div", {}, h("b", {}, pop(d.precipitation_probability_max[0])), "강수확률"))),
    air.length ? h("div", { class: "wxcard wxair" }, air.map(([label, v, cut]) => {
      const [g, cls] = pmGrade(v, cut);
      return h("div", {}, label, h("b", { class: cls }, g), h("small", {}, Math.round(v) + "㎍/㎥"));
    })) : null,
    h("div", { class: "wxcard" }, h("div", { class: "wxh" }, "시간별"),
      h("div", { class: "wxhours" }, hours.map((i) => h("div", {},
        h("small", {}, +hr.time[i].slice(11, 13) + "시"), h("span", {}, wxCode(hr.weather_code[i], hr.is_day[i])[1]),
        h("b", {}, r(hr.temperature_2m[i])), h("small", { class: "wxpop" }, pop(hr.precipitation_probability[i])))))),
    h("div", { class: "wxcard" }, h("div", { class: "wxh" }, "주간 예보"),
      d.time.slice(1, 6).map((t, k) => h("div", { class: "wxday" },
        h("span", {}, k === 0 ? "내일" : wd(t)), h("span", {}, wxCode(d.weather_code[k + 1])[1]),
        h("small", { class: "wxpop" }, pop(d.precipitation_probability_max[k + 1])),
        h("span", {}, h("span", { class: "lo" }, r(d.temperature_2m_min[k + 1])), " / ", h("b", {}, r(d.temperature_2m_max[k + 1])))))),
    h("div", { class: "wxsrc" }, "날씨·미세먼지: Open-Meteo"));
}

/* ================= 다이얼로그: 꿀팁 메모 ================= */
let editingNote = null;
// 저장된 메모는 보기 모드로, 새 메모는 바로 수정 모드로 열기
function openNote(n) {
  editingNote = n;
  $("nDelete").classList.toggle("hidden", !n);
  noteMode(n ? "view" : "edit");
  $("noteDlg").showModal();
}
function noteMode(mode) {
  const n = editingNote, view = mode === "view";
  $("nView").classList.toggle("hidden", !view);
  $("nEdit").classList.toggle("hidden", view);
  $("nEditBtn").classList.toggle("hidden", !view);
  $("nSave").classList.toggle("hidden", view);
  $("nCancel").textContent = view ? "닫기" : "취소";
  if (view) {
    $("nViewTitle").textContent = n.title || "제목 없음";
    $("nViewBody").textContent = n.body || "(내용 없음)";
    $("nEditBtn").focus();
  } else {
    $("nDlgTitle").textContent = n ? "메모 수정" : "새 메모";
    $("nTitle").value = n ? n.title : ""; $("nBody").value = n ? n.body : "";
    (n ? $("nBody") : $("nTitle")).focus();
  }
}
$("nEditBtn").onclick = () => noteMode("edit");
// 수정 중 취소 → 저장된 메모면 보기 모드로 돌아감, 새 메모면 닫기
$("nCancel").onclick = () => (editingNote && !$("nEdit").classList.contains("hidden") ? noteMode("view") : $("noteDlg").close());
$("noteForm").onsubmit = async (e) => {
  e.preventDefault();
  const title = $("nTitle").value.trim(), body = $("nBody").value;
  $("noteDlg").close();
  if (!title && !body.trim()) return;   // 빈 메모는 저장 안 함
  const row = { title, body, updated_at: new Date().toISOString() };
  if (editingNote) {
    const { error } = await sb.from("notes").update(row).eq("id", editingNote.id);
    if (error) return toast("저장 실패: " + error.message);
    Object.assign(editingNote, row);
  } else {
    const { data, error } = await sb.from("notes").insert(row).select().single();
    if (error) return toast("추가 실패: " + error.message);
    S.notes.push(data);
  }
  S.notes.sort((a, b) => b.updated_at.localeCompare(a.updated_at));
  render();
};
$("nDelete").onclick = async () => {
  const n = editingNote;
  if (!confirm(`'${n.title || "제목 없음"}' 메모를 삭제할까요?`)) return;
  $("noteDlg").close();
  const { error } = await sb.from("notes").delete().eq("id", n.id);
  if (error) return toast("삭제 실패: " + error.message);
  S.notes = S.notes.filter((x) => x !== n);

};

  if (editingProj) {
    const { error } = await sb.from("projects").update({ name, color: projColor }).eq("id", editingProj.id);
    if (error) return toast("저장 실패: " + error.message);
    Object.assign(editingProj, { name, color: projColor });
  } else {
    // 새 프로젝트는 맨 아래에
    const sort_order = S.projects.reduce((m, p) => Math.max(m, p.sort_order ?? 0), -1) + 1;
    const { data, error } = await sb.from("projects").insert({ name, color: projColor, sort_order }).select().single();
    if (error) return toast("추가 실패: " + error.message);
    S.projects.push(data); S.view = "p:" + data.id;
  }
  render();
};
$("pDelete").onclick = async () => {
  const p = editingProj;
  if (!confirm(`'${p.name}' 프로젝트를 삭제할까요?\n안에 있던 할 일은 지워지지 않고 '프로젝트 없음'으로 옮겨져요.`)) return;
  $("projDlg").close();
  const { error } = await sb.from("projects").delete().eq("id", p.id);
  if (error) return toast("삭제 실패: " + error.message);
  S.projects = S.projects.filter((x) => x.id !== p.id);
  S.todos.forEach((t) => { if (t.project_id === p.id) t.project_id = null; });
  if (S.view === "p:" + p.id) S.view = "today";
  render();
};

/* ================= 날짜 바뀜 처리 / PWA ================= */
// 1분마다 확인해서 날짜가 바뀌거나 아침 8시가 되면 화면 다시 그림
const dayKey = () => today() + "|" + dailyDay();
let lastDay = dayKey();
setInterval(() => { if (dayKey() !== lastDay) { lastDay = dayKey(); render(); } }, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
